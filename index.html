<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NeetCode 30 — Lộ trình thuật toán 1 tháng</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="./assets/css/app.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">30</span>
      <div>
        <strong>NeetCode 30</strong>
        <small>Thuật toán trong 1 tháng</small>
      </div>
    </div>

    <div class="row" id="lang-switch" style="gap:6px;margin:2px 0 4px">
      <button class="btn small" data-lang="javascript" style="flex:1">🟨 JavaScript</button>
      <button class="btn ghost small" data-lang="python" style="flex:1">🐍 Python</button>
    </div>

    <button id="pal-open" class="btn ghost small pal-open">🔍 Tìm bài, chủ đề… <span class="kbd">Ctrl</span><span class="kbd">K</span></button>

    <nav id="nav">
      <a href="#/" data-route="/">🏠 Bảng điều khiển</a>
      <a href="#/plan" data-route="/plan">🗓️ Lộ trình</a>
      <a href="#/topics" data-route="/topics">📚 Thư viện chủ đề</a>
      <a href="#/problems" data-route="/problems">⌨️ Ngân hàng bài tập</a>
      <a href="#/review" data-route="/review">🔁 Ôn tập ngắt quãng <span id="due-badge" class="badge hidden">0</span></a>
      <div class="nav-sep">Ghi nhớ</div>
      <a href="#/notebook" data-route="/notebook">📔 Sổ tay</a>
      <a href="#/cheatsheet" data-route="/cheatsheet">🔎 Tra cứu nhanh</a>
      <a href="#/drill" data-route="/drill">🧠 Luyện nhớ <span id="card-badge" class="badge hidden">0</span></a>
      <div class="nav-sep">Theo dõi</div>
      <a href="#/stats" data-route="/stats">📈 Thống kê &amp; điểm</a>
      <a href="#/guide" data-route="/guide">🧭 Cách dùng app</a>
    </nav>

    <div class="sidebar-foot">
      <div class="xp-box">
        <div class="xp-row"><span>Tổng điểm</span><strong id="xp-total">0</strong></div>
        <div class="xp-row"><span>Chuỗi ngày</span><strong id="streak-total">0 🔥</strong></div>
      </div>
      <button id="theme-toggle" class="btn ghost small">🌗 Đổi giao diện</button>
    </div>
  </aside>

  <main id="view" class="view"></main>
</div>

<div id="toast" class="toast hidden"></div>

<!-- Bảng lệnh Ctrl+K: nằm NGOÀI #view nên không bị xoá mỗi lần đổi trang -->
<div id="palette" class="palette hidden" role="dialog" aria-modal="true" aria-label="Tìm nhanh">
  <div class="pal-box">
    <input id="pal-q" class="pal-input" type="text" autocomplete="off" spellcheck="false"
           placeholder="Tìm bài tập, chủ đề, trang… (gõ không dấu cũng được)" aria-label="Từ khoá tìm kiếm" />
    <div id="pal-list" class="pal-list"></div>
    <div class="pal-foot">
      <span><span class="kbd">↑</span><span class="kbd">↓</span> chọn</span>
      <span><span class="kbd">Enter</span> mở</span>
      <span><span class="kbd">Esc</span> đóng</span>
    </div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
